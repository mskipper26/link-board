<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Board</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>

  <header id="appHeader" class="header hidden">
    <h1 class="header-title">Link Board</h1>
    <button id="editBtn" class="btn-edit">Edit</button>
  </header>

  <nav id="viewControls" class="view-controls hidden">
    <div class="view-modes">
      <button class="view-mode-btn active" data-mode="all">All</button>
      <button class="view-mode-btn" data-mode="grouped">By Category</button>
      <button class="view-mode-btn" data-mode="filter">Filter</button>
    </div>
    <div id="categoryFilters" class="category-filters hidden"></div>
  </nav>

  <main id="linkGrid" class="board hidden"></main>

  <datalist id="categoryOptions"></datalist>

  <!-- Hover preview popup -->
  <div id="previewPopup" class="preview-popup hidden">
    <div id="previewImageWrap" class="preview-image-wrap">
      <img id="previewImg" class="preview-img" alt="">
    </div>
    <div class="preview-body">
      <div id="previewTitle" class="preview-title"></div>
      <div id="previewDesc" class="preview-desc"></div>
      <div id="previewUrl" class="preview-url"></div>
    </div>
  </div>

  <!-- Auth modal -->
  <div id="authModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h2 class="modal-heading">Enter Passkey</h2>
      <input
        id="passkeyInput"
        type="password"
        class="modal-input"
        placeholder="Passkey"
        autocomplete="current-password"
      >
      <div id="authError" class="modal-error hidden">Incorrect passkey.</div>
      <div class="modal-actions">
        <button id="authCancelBtn" class="btn-secondary hidden">Cancel</button>
        <button id="authSubmitBtn" class="btn-primary">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Edit overlay -->
  <div id="editOverlay" class="overlay-backdrop hidden">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h2 class="overlay-title">Edit Links</h2>
        <button id="addLinkBtn" class="btn-add">+ Add Link</button>
      </div>
      <div id="editList" class="edit-list"></div>
      <div class="overlay-footer">
        <span id="saveError" class="save-error hidden">Failed to save. Please try again.</span>
        <button id="cancelEditBtn" class="btn-secondary">Cancel</button>
        <button id="saveBtn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=8"></script>
</body>
</html>
